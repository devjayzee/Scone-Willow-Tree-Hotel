name: Tests

on:
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened, ready_for_review]
  # Redundant with pull_request when merging via a PR (the merge commit is
  # the same SHA the PR checks ran on). Kept for direct pushes to main
  # (hotfixes that bypass the PR workflow).
  push:
    branches: [main]

# Cancel in-flight runs when a new push comes in on the same ref. Applies
# workflow-wide so all jobs cancel together.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. Individual jobs can escalate if they ever need to.
permissions:
  contents: read

jobs:
  # Lint/Typecheck/Test/Smoke are required status checks on main and
  # development. A required check that never runs (which is what
  # paths-ignore on the workflow's own `on:` block used to cause for
  # doc/.claude/plans-only PRs) blocks the PR forever with no bypass —
  # whereas a required check that runs and is skipped via job-level
  # `if:` satisfies branch protection normally. So: always trigger the
  # workflow, and gate real work on this job's output instead.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qvE '\.md$|^\.claude/|^plans/|^\.gitignore$|^\.githooks/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.changes.outputs.relevant == 'true' && (github.event.pull_request.draft == false || github.event_name == 'push')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.changes.outputs.relevant == 'true' && (github.event.pull_request.draft == false || github.event_name == 'push')
    env:
      # Placeholders — prisma.config.ts now uses env() which throws
      # if these are missing at config-load time. The values are never
      # actually used by generate/typecheck (no DB connection needed).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  test:
    name: Test
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.changes.outputs.relevant == 'true' && (github.event.pull_request.draft == false || github.event_name == 'push')
    env:
      # Placeholders — see typecheck job comment.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:run

  smoke:
    # Post-deploy browser smoke for the four auth pages (#135). Catches
    # CSP / hydration / chunk-load regressions that vitest and curl
    # can't see — the exact class of bug that shipped PR #130's CSP
    # outage. Scoped to render + hydration; no live DB required.
    name: Smoke
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.changes.outputs.relevant == 'true' && (github.event.pull_request.draft == false || github.event_name == 'push')
    env:
      # Placeholder secrets — enough to boot the built app. The
      # smoke never hits an endpoint that queries the DB or sends
      # email; these values just satisfy fail-fast guards.
      #
      # - NEXTAUTH_SECRET: required by src/lib/auth.ts at module load.
      # - NEXTAUTH_URL: required by src/lib/email/app-url.ts.
      # - DATABASE_URL / DIRECT_URL: Prisma client construction is
      #   lazy; the smoke doesn't query.
      # - RESEND_API_KEY / EMAIL_FROM: src/lib/email/email-transport.ts
      #   throws at module load when NODE_ENV=production (which
      #   `next build` sets) and either is missing. Placeholders keep
      #   the guard happy without sending real mail.
      # - UPSTASH_REDIS_REST_URL / _TOKEN: src/lib/services/rate-limit-service.ts
      #   throws at module load when NODE_ENV=production and either is
      #   missing. Placeholders keep the guard happy; the smoke never
      #   actually hits Upstash.
      NEXTAUTH_SECRET: ci-smoke-secret-placeholder-32-chars-ok
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      RESEND_API_KEY: ci-smoke-resend-placeholder
      EMAIL_FROM: ci-smoke@example.invalid
      UPSTASH_REDIS_REST_URL: https://ci-smoke-upstash.placeholder.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-smoke-upstash-token-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      # Cache Playwright's browsers separately from npm — ~200MB and
      # invalidated only by the Playwright version, not package-lock.
      - name: Playwright browsers cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

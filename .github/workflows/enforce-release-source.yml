name: Enforce release source

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

jobs:
  guard:
    name: PR to main must come from development or hotfix/*
    runs-on: ubuntu-latest
    steps:
      - name: Assert head branch is development or hotfix/*
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Dependabot security updates always target the default branch
          # (main) — the target-branch option in dependabot.yml does not
          # apply to security PRs, per GitHub docs. Exempt them so CVE
          # patches can fast-track directly to main.
          if [ "$PR_ACTOR" = "dependabot[bot]" ]; then
            echo "OK: dependabot PR — security updates may fast-track to main"
            exit 0
          fi
          # hotfix/* branches off main go directly back into main so a
          # targeted prod fix can ship without carrying whatever
          # unrelated in-flight work is currently sitting on development.
          # After merge, merge main back into development to bring the
          # fix forward.
          case "$HEAD_REF" in
            hotfix/*)
              echo "OK: hotfix PR — direct-to-main path"
              exit 0
              ;;
          esac
          if [ "$HEAD_REF" != "development" ]; then
            echo "::error::PRs to main must come from 'development' or a 'hotfix/*' branch (got: '$HEAD_REF'). Retarget this PR to 'development' first, then cut a release PR — or rename the branch to 'hotfix/<name>' if this is a targeted production fix."
            exit 1
          fi
          echo "OK: release PR from development"
